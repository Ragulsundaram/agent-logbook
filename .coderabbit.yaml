# CodeRabbit review settings. The maintainer is not a full-time reviewer, so
# CodeRabbit requests changes on blocking findings and the pre-merge checks
# below fail the PR. Schema: https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: assertive
  # Requests changes on blocking findings; approves only once they are resolved.
  auto_approvals:
    enabled: true
  security_risk_instructions: |
    Treat as high risk anything that could send transcript text, file contents or
    tokens off the machine, run a shell or a string as code, write outside the
    locations in README.md, or weaken the Check workflow or check.js.
  pre_merge_checks:
    # Only the maintainer can wave a failing check through, not the PR author.
    override_requested_reviewers_only: true
    description:
      mode: error
    custom_checks:
      - name: No dependencies or build step
        mode: error
        instructions: Fail if package.json gains dependencies, devDependencies, optionalDependencies, peerDependencies, bundleDependencies, or any install, prepare, prepack or postpack script, or if the PR adds a bundler, lockfile or build step.
      - name: No new network access
        mode: error
        instructions: Fail if any changed file (JavaScript, HTML, shell script, workflow or other) adds fetch, http, https, net, tls, dgram, dns, http2, WebSocket, XMLHttpRequest, sendBeacon, EventSource, or a remote URL loaded into a webview. The only allowed request is the existing plan-usage call to api.anthropic.com in scan.js.
      - name: No shell strings or code from strings
        mode: error
        instructions: Fail if the PR adds exec or execSync from child_process, shell true, eval, new Function, a computed require, dynamic import(), a shell interpreter (sh, bash, zsh, cmd, powershell) run through execFile or spawn with a command string such as -c, or a sendText call built from text that did not come from a validated id or a fixed command.
      - name: Webview output escaped
        mode: error
        instructions: Fail if any new innerHTML, outerHTML or insertAdjacentHTML in media/*.js, or any webview HTML built in extension.js or another file, uses a value that is not passed through esc() or is not a fixed string, or if the Content-Security-Policy or nonce in extension.js is changed.
      - name: No transcripts or secrets committed
        mode: error
        instructions: Fail if the PR adds a .jsonl file, a real-looking chat transcript, a screenshot of a chat, an API key, token or password.
      - name: Protected files untouched
        mode: error
        instructions: Fail if the PR changes CHANGELOG.md, the version field in package.json, .github/workflows, .github/check.js, AGENTS.md or SECURITY.md, unless the PR author is Ragulsundaram.
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  path_filters:
    - '!**/*.vsix'
  path_instructions:
    - path: '**/*'
      instructions: |
        This VS Code extension reads private Claude Code and Codex transcripts.
        Hold every change to the hard rules in AGENTS.md and flag any break as a blocker:
        1. No dependencies, install scripts, bundler or build step.
        2. No network calls except the plan-usage request to api.anthropic.com in scan.js.
        3. No real transcripts, .jsonl files or screenshots of real chats.
        4. No shell strings: execFile with an argument array; sendText only from validated values.
        5. Webview text escaped with esc() or textContent; CSP and nonce in extension.js unchanged.
        6. Any new write location must be added to README.md "What it reads and writes".
        Also flag changes outside the linked issue's scope and edits to CHANGELOG.md or the package.json version.
    - path: '{scan.js,mcp-server.js,mcp-setup.js,extension.js}'
      instructions: |
        Sensitive file. Trace where every new file path, process argument, URL and
        webview string comes from. Flag anything that could send transcript content
        off the machine or write outside the documented locations.
    - path: 'media/**'
      instructions: |
        Check every innerHTML, outerHTML and insertAdjacentHTML for unescaped
        transcript text, and flag any remote script, style or font.
    - path: '.github/**'
      instructions: |
        Workflows must keep pull_request (never pull_request_target), read-only
        permissions, and actions pinned to full commit SHAs. Flag any weakening of check.js.
    - path: 'package.json'
      instructions: |
        Flag any dependencies, devDependencies, install/prepare scripts, version change,
        or setting outside the claudeHistory. prefix.
  tools:
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true
